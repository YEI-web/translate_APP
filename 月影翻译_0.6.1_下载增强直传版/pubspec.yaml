name: moonshadow_translate
version: 0.6.1+11
publish_to: none
description: Personal cross-platform translation workstation with desktop overlays.
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.2
  screen_capturer: ^0.2.3
  llama_flutter_android: ^0.2.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
    - assets/icons/app_icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.jpg
  adaptive_icon_foreground: assets/icons/app_icon.jpg
  adaptive_icon_background: "#6B3AF5"
  windows:
    generate: true
    image_path: assets/icons/app_icon.jpg
  macos:
    generate: true
    image_path: assets/icons/app_icon.jpg
  linux:
    generate: true
    image_path: assets/icons/app_icon.jpg
  web:
    generate: true
    image_path: assets/icons/app_icon.jpg
